# Configuración común (sin secretos)
# No hay perfil por defecto: hay que activar "dev", "prod" o "test" explícitamente
# (ver PerfilObligatorioPostProcessor), para no arrancar nunca en producción con H2.
spring.application.name=voleiballDonana
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Thymeleaf renderiza la página entera antes de escribir la respuesta. Sin esto, la respuesta se
# envía por partes y, al llegar a un formulario con th:action, Spring Security no puede crear la
# sesión para el token CSRF ("Cannot create a session after the response has been committed").
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Administrador inicial: solo se usa si todavía no hay ningún ADMIN (ver config/AdminInicial).
club.admin.email=${ADMIN_EMAIL:}
club.admin.password=${ADMIN_PASSWORD:}
club.admin.nombre=${ADMIN_NOMBRE:Administración}

# Login: bloqueo temporal tras varios intentos fallidos seguidos
club.acceso.max-intentos=5
club.acceso.bloqueo=15m

# Subida de logos: el servicio limita cada logo a 1 MB con un mensaje claro. Aquí el tope del
# servidor es más alto para que un archivo algo mayor llegue al servicio y no acabe en un error 403.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
