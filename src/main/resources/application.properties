# Configuración común (sin secretos)
# No hay perfil por defecto: hay que activar "dev", "prod" o "test" explícitamente
# (ver PerfilObligatorioPostProcessor), para no arrancar nunca en producción con H2.
spring.application.name=voleiballDonana
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Thymeleaf renderiza la página entera antes de escribir la respuesta. Sin esto, la respuesta se
# envía por partes y, al llegar a un formulario con th:action, Spring Security no puede crear la
# sesión para el token CSRF ("Cannot create a session after the response has been committed").
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
