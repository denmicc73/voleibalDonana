<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Restablecer contraseña · Panel · Almonte Doñana', 'Contraseña temporal para un usuario del panel.')}">
    <title>Restablecer contraseña · Panel · Almonte Doñana</title>
</head>
<body class="cuerpo-panel">
<div th:replace="~{fragments/admin :: cabecera('usuarios')}"></div>

<main id="contenido" class="panel">
    <div class="contenedor panel__estrecho">
        <p><a class="panel__volver" th:href="@{/admin/usuarios}">&larr; Usuarios</a></p>
        <h1 class="titular panel__titulo">Restablecer contraseña</h1>
        <p class="panel__entradilla">
            Para <strong th:text="${usuario.nombre}">Nombre</strong> (<span th:text="${usuario.email}">email</span>).
            Se cerrarán sus sesiones abiertas y se quitará el bloqueo si lo tiene. Comunícale la contraseña en
            persona y pídele que la cambie en "Mi cuenta".
        </p>

        <form class="panel-formulario" th:action="@{/admin/usuarios/{id}/password(id=${usuario.id})}"
              th:object="${form}" method="post" novalidate>
            <div class="formulario__campos">
                <div class="campo">
                    <label class="campo__etiqueta" for="password">Contraseña temporal</label>
                    <p class="campo__ayuda">Mínimo 12 caracteres.</p>
                    <!-- Sin th:field: la contraseña no se devuelve en la página si hay errores -->
                    <input class="campo__control" id="password" name="password" type="password" required
                           minlength="12" maxlength="72" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'campo__control--error'"
                           th:attr="aria-describedby=${#fields.hasErrors('password')} ? 'password-error'">
                    <p class="campo__error" id="password-error" th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">Error</p>
                </div>
                <button class="boton boton--amarillo formulario__boton" type="submit">Guardar contraseña temporal</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
