<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Cabecera del panel de administración. Uso:
  <div th:replace="~{fragments/admin :: cabecera('inicio')}"></div>
  "activo" marca con aria-current el enlace de la página actual: inicio, usuarios o cuenta.
  Necesita en el modelo "usuarioActual" (lo añade PanelModelAdvice).
-->
<th:block th:fragment="cabecera(activo)">
    <a class="saltar-al-contenido" href="#contenido">Saltar al contenido</a>
    <header class="panel-cabecera">
        <div class="contenedor panel-cabecera__barra">
            <a class="marca" th:href="@{/admin}">
                <img class="marca__escudo" th:src="@{/img/escudo-provisional.svg}" alt="" width="40" height="45">
                <span class="marca__texto">
                    <span class="marca__nombre">Almonte Doñana</span>
                    <span class="marca__sub">Panel del club</span>
                </span>
            </a>
            <nav class="panel-menu" aria-label="Panel">
                <ul class="panel-menu__lista">
                    <li><a class="panel-menu__enlace" th:href="@{/admin}"
                           th:attr="aria-current=${activo == 'inicio'} ? 'page'">Inicio</a></li>
                    <li th:if="${usuarioActual != null and usuarioActual.admin}">
                        <a class="panel-menu__enlace" th:href="@{/admin/usuarios}"
                           th:attr="aria-current=${activo == 'usuarios'} ? 'page'">Usuarios</a></li>
                    <li><a class="panel-menu__enlace" th:href="@{/admin/cuenta}"
                           th:attr="aria-current=${activo == 'cuenta'} ? 'page'">Mi cuenta</a></li>
                    <li><a class="panel-menu__enlace" th:href="@{/}">Ver la web</a></li>
                </ul>
                <form class="panel-menu__salir" th:action="@{/admin/logout}" method="post">
                    <span class="panel-menu__usuario" th:if="${usuarioActual != null}"
                          th:text="${usuarioActual.nombre}">Nombre</span>
                    <button class="boton boton--contorno-claro" type="submit">Cerrar sesión</button>
                </form>
            </nav>
        </div>
    </header>
</th:block>

<!--
  Avisos tras una acción (atributos flash "aviso" y "error"). Uso:
  <div th:replace="~{fragments/admin :: avisos}"></div>
-->
<th:block th:fragment="avisos">
    <p class="aviso aviso--ok" role="status" th:if="${aviso}" th:text="${aviso}">Hecho.</p>
    <p class="aviso aviso--error" role="alert" th:if="${error}" th:text="${error}">Error.</p>
</th:block>
</body>
</html>
