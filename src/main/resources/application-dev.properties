# Perfil de desarrollo: H2 en memoria (modo MySQL)
# Requiere el perfil Maven "dev" (-Pdev), que añade H2 y su consola al classpath.
spring.datasource.url=jdbc:h2:mem:voleibal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
spring.jpa.show-sql=false
