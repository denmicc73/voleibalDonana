# Perfil de producción: todo por variables de entorno
# Variables: SPRING_PROFILES_ACTIVE=prod, DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.flyway.clean-disabled=true

# Sesión y cookies
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Errores sin detalles técnicos (la página es templates/error.html)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Detrás del proxy del hosting
server.forward-headers-strategy=framework
# Pendiente (Fase 9, según el hosting): redirección a HTTPS y HSTS
